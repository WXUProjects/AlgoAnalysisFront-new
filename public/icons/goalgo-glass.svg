<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GoAlgo">
  <defs>
    <!-- shared mark geometry: outer (rim) and inner (body) weights -->
    <g id="gg-rim" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M184 140 108 256l76 116" stroke-width="47"/>
      <path d="M328 140l76 116-76 116" stroke-width="47"/>
      <path d="M228 324 284 188" stroke-width="25"/>
      <circle cx="228" cy="324" r="27.5" fill="currentColor" stroke="none"/>
      <circle cx="256" cy="256" r="27.5" fill="currentColor" stroke="none"/>
      <circle cx="284" cy="188" r="27.5" fill="currentColor" stroke="none"/>
    </g>
    <g id="gg-body" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M184 140 108 256l76 116" stroke-width="40"/>
      <path d="M328 140l76 116-76 116" stroke-width="40"/>
      <path d="M228 324 284 188" stroke-width="18"/>
      <circle cx="228" cy="324" r="24" fill="currentColor" stroke="none"/>
      <circle cx="256" cy="256" r="24" fill="currentColor" stroke="none"/>
      <circle cx="284" cy="188" r="24" fill="currentColor" stroke="none"/>
    </g>
    <g id="gg-chain" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M228 324 284 188" stroke-width="18"/>
      <circle cx="228" cy="324" r="24" fill="currentColor" stroke="none"/>
      <circle cx="256" cy="256" r="24" fill="currentColor" stroke="none"/>
      <circle cx="284" cy="188" r="24" fill="currentColor" stroke="none"/>
    </g>

    <mask id="gg-m-rim"><use href="#gg-rim" color="#fff"/></mask>
    <mask id="gg-m-body"><use href="#gg-body" color="#fff"/></mask>
    <mask id="gg-m-chain"><use href="#gg-chain" color="#fff"/></mask>
    <clipPath id="gg-card"><rect width="512" height="512" rx="114"/></clipPath>

    <linearGradient id="gg-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131C4A"/>
      <stop offset=".55" stop-color="#0D1436"/>
      <stop offset="1" stop-color="#060A1E"/>
    </linearGradient>
    <linearGradient id="gg-fill" x1="120" y1="110" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".40"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="gg-rimg" x1="120" y1="110" x2="400" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#BFE9FF" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#8FF3E4" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="gg-chaing" x1="220" y1="340" x2="300" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BE3C4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#5BC8FF" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="gg-gloss" x1="0" y1="0" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="gg-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="58"/></filter>
    <filter id="gg-refract" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="gg-drop" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="gg-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>

    <g id="gg-blobs">
      <ellipse cx="118" cy="98" rx="186" ry="156" fill="#3B5BFF"/>
      <ellipse cx="428" cy="122" rx="150" ry="140" fill="#22D3EE" opacity=".8"/>
      <ellipse cx="86" cy="446" rx="170" ry="150" fill="#12B8A6" opacity=".72"/>
      <ellipse cx="436" cy="440" rx="178" ry="164" fill="#4F46E5"/>
    </g>
  </defs>

  <g clip-path="url(#gg-card)">
    <rect width="512" height="512" fill="url(#gg-bg)"/>
    <g filter="url(#gg-soft)" opacity=".85"><use href="#gg-blobs"/></g>

    <!-- cast shadow under the glass -->
    <g transform="translate(0 18)" filter="url(#gg-drop)" opacity=".55">
      <use href="#gg-rim" color="#03060F"/>
    </g>

    <!-- specular rim -->
    <rect width="512" height="512" fill="url(#gg-rimg)" mask="url(#gg-m-rim)"/>

    <!-- glass body: refracted backdrop + frost -->
    <g mask="url(#gg-m-body)">
      <rect width="512" height="512" fill="url(#gg-bg)" opacity=".55"/>
      <g transform="translate(256 256) scale(1.45) translate(-256 -256)" filter="url(#gg-refract)" opacity=".95">
        <use href="#gg-blobs"/>
      </g>
      <rect width="512" height="512" fill="url(#gg-fill)"/>
      <ellipse cx="170" cy="126" rx="220" ry="70" fill="#fff" opacity=".28"
               transform="rotate(-34 170 126)" filter="url(#gg-refract)"/>
    </g>

    <!-- the traversal path glows through the glass -->
    <g filter="url(#gg-glow)" opacity=".55">
      <use href="#gg-chain" color="#2BE3C4"/>
    </g>
    <rect width="512" height="512" fill="url(#gg-chaing)" mask="url(#gg-m-chain)"/>

    <!-- top light on the card -->
    <path d="M0 0h512v88c-142 92-372 92-512 6Z" fill="url(#gg-gloss)"/>
  </g>
</svg>
